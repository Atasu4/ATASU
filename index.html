<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATASU Analiz</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#05070b;
 color:#eee;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
 max-width:760px;
 margin:auto;
 padding:16px;
}

h1{
 margin:5px 0;
 color:#e0b94f;
 font-size:25px;
}

.sub{
 color:#999;
 font-size:12px;
 margin-bottom:14px;
}

.card{
 background:linear-gradient(145deg,#10141b,#090c11);
 border:1px solid #282d36;
 border-radius:14px;
 padding:14px;
 margin:10px 0;
}

.hero{
 border-color:#6c5a28;
 background:linear-gradient(145deg,#17150d,#090c11);
}

label{
 display:block;
 color:#aaa;
 font-size:12px;
 margin-bottom:6px;
}

textarea,input{
 width:100%;
 background:#05070a;
 color:#eee;
 border:1px solid #363b44;
 border-radius:9px;
 padding:11px;
 font-size:16px;
}

textarea{
 min-height:220px;
 resize:vertical;
}

button{
 border:0;
 border-radius:10px;
 padding:12px;
 font-weight:800;
 font-size:13px;
}

.clear{
 width:100%;
 margin-top:8px;
 background:#292d34;
 color:#ddd;
 border:1px solid #444;
}

.tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin:12px 0;
}

.tabs button{
 padding:12px 4px;
}

/* ATASU MODEL */
.tabs button:first-child{
 background:linear-gradient(135deg,#715817,#c89e2d);
 color:#ffeaa0;
 border:1px solid #d9b548;
}

.tabs button:first-child.on{
 background:linear-gradient(135deg,#b78a20,#f0cf67);
 color:#080808;
 border-color:#ffe28a;
}

/* +6 GOL */
.tabs button:last-child{
 background:linear-gradient(135deg,#4e1515,#8d2020);
 color:#ffcaca;
 border:1px solid #a93535;
}

.tabs button:last-child.on{
 background:linear-gradient(135deg,#8c1f1f,#dc4444);
 color:#fff;
 border-color:#ff6969;
}

.panel{display:none}
.panel.on{display:block}

.g2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.k{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-bottom:10px;
}

.k div{
 text-align:center;
 background:#080a0e;
 border:1px solid #252932;
 border-radius:9px;
 padding:9px 4px;
}

.k b{
 display:block;
 color:#d8b754;
 font-size:19px;
}

.k small{
 font-size:10px;
 color:#888;
}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 border-bottom:1px solid #242830;
 padding:9px 2px;
 font-size:13px;
}

.row:last-child{
 border-bottom:0;
}

.row b{
 color:#d9b85c;
}

small{
 color:#9298a2;
}

.good{
 color:#70df91!important;
}

.mid{
 color:#f0c957!important;
}

.bad{
 color:#ff7777!important;
}

.codebox{
 display:inline-block;
 margin:3px;
 padding:5px 7px;
 border:1px solid #3c414a;
 border-radius:7px;
 color:#d9b85c;
 font-size:12px;
}

.title{
 color:#d9b85c;
 font-weight:800;
 margin-bottom:8px;
}

#oddsPanel .go{
 width:100%;
 margin-top:10px;
 background:linear-gradient(90deg,#b98a20,#f2d36d);
 color:#070707;
}

#plusPanel .go{
 width:100%;
 margin-top:10px;
 background:linear-gradient(90deg,#831d1d,#df4747);
 color:white;
}

.consensus{
 display:grid;
 grid-template-columns:1.2fr .7fr .7fr .7fr;
 gap:5px;
 align-items:center;
 border-bottom:1px solid #242830;
 padding:9px 0;
 font-size:12px;
}

.consensus.head{
 color:#777;
 font-size:10px;
}

.consensus strong{
 color:#eee;
}

.pill{
 border:1px solid #3a3f48;
 border-radius:20px;
 padding:4px 7px;
 text-align:center;
 font-size:10px;
 font-weight:800;
}

.scorechips{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
}

.scorechips span{
 border:1px solid #333842;
 border-radius:8px;
 padding:6px 8px;
 font-size:12px;
}

.note{
 padding:9px;
 border:1px solid #2d323a;
 border-radius:9px;
 background:#080a0e;
 margin-top:10px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>ATASU ANALİZ</h1>
<div class="sub" id="meta">Geçmiş veri yükleniyor...</div>

<div class="card">

<label>ORAN BLOĞUNU YAPIŞTIR</label>

<textarea id="bulk" placeholder="Maç Sonucu 09614
1
4.38
X
3.51
2
1.51

2,5 Alt/Üst 09636
Alt
1.79
Üst
1.62

Karşılıklı Gol 09626
Var
1.62
Yok
1.79"></textarea>

<div class="g2" style="margin-top:8px">

<div>
<label>Oran toleransı (±)</label>
<input id="tol" value="0.05" inputmode="decimal">
</div>

<div>
<label>Lig filtresi</label>
<input id="league" placeholder="İsteğe bağlı">
</div>

</div>

<button class="clear" onclick="clearAll()">TEMİZLE</button>

</div>


<div class="tabs">

<button class="on" onclick="tab('oddsPanel',this)">
ATASU MODEL
</button>

<button onclick="tab('plusPanel',this)">
+6 GOL
</button>

</div>


<section id="oddsPanel" class="panel on">

<div class="card">

<div class="title">
Geçmiş + Matematiksel Model
</div>

<small>
Gerçek geçmiş eşleşmeleri ve piyasa-türevi gol modeli birlikte hesaplanır.
</small>

<button class="go" onclick="scanOdds()">
ANALİZ ET
</button>

</div>

<div id="oddsOut"></div>

</section>


<section id="plusPanel" class="panel">

<div class="card">

<div class="title">
+6 Gol Analizi
</div>

<small>
Gerekli oranlar üstteki metinden otomatik alınır.
</small>

<button class="go" onclick="scanPlus6()">
+6 ANALİZ ET
</button>

</div>

<div id="plusOut"></div>

</section>

</div>


<script>

const MARKET_NAMES={
 h:'MS 1',
 d:'MS X',
 a:'MS 2',
 u25:'2,5 Alt',
 o25:'2,5 Üst',
 btts:'KG Var',
 nobtts:'KG Yok',
 u35:'3,5 Alt',
 o35:'3,5 Üst',
 iyu15:'İY 1,5 Alt',
 iyo15:'İY 1,5 Üst',
 g6:'6+ Gol'
};


function tab(id,b){

 document.querySelectorAll('.panel')
 .forEach(x=>x.classList.remove('on'));

 document.querySelectorAll('.tabs button')
 .forEach(x=>x.classList.remove('on'));

 document.getElementById(id).classList.add('on');

 b.classList.add('on');
}


function numberValue(id){

 const v=document
 .getElementById(id)
 .value
 .trim()
 .replace(',','.');

 return v==='' ? null : Number(v);
}


async function post(url,data){

 const r=await fetch(url,{
  method:'POST',
  headers:{
   'content-type':'application/json'
  },
  body:JSON.stringify(data)
 });

 let j;

 try{
  j=await r.json();
 }
 catch{
  throw new Error(
   'Sunucudan geçersiz cevap geldi.'
  );
 }

 if(!r.ok){
  throw new Error(
   j.detail || 'İşlem başarısız.'
  );
 }

 return j;
}


function cleanTitle(s){

 return s
 .replace(/\b\d{5}\b/g,'')
 .replace(/\s+/g,' ')
 .trim();
}


function statsHTML(s){

 if(!s)return '';

 const skip=new Set([
  'sample_ft',
  'sample_ht',
  'avg_goals',
  'avg_home_goals',
  'avg_away_goals',
  'top_scores'
 ]);

 return Object.entries(s)

 .filter(([k,v])=>
  !skip.has(k) &&
  v!==null &&
  typeof v==='number'
 )

 .sort((a,b)=>b[1]-a[1])

 .map(([k,v])=>`

 <div class="row">
  <span>${k}</span>
  <b>%${v}</b>
 </div>

 `).join('');
}


function parseBulk(){

 const text=document
 .getElementById('bulk')
 .value
 .replace(/\r/g,'');

 if(!text.trim()){
  throw new Error(
   'Önce oran bloğunu yapıştır.'
  );
 }

 const lines=text
 .split('\n')
 .map(x=>x.trim())
 .filter(Boolean);

 const odds={};

 const plus6={
  o25:null,
  o35:null,
  o45:null,
  btts:null,
  iy05:null,
  nofirst:null
 };

 let current='';


 for(let i=0;i<lines.length;i++){

  const line=lines[i];

  const cm=line.match(/\b(\d{5})\b/);

  if(cm){

   current=cleanTitle(line);

   continue;
  }


  if(i+1>=lines.length)continue;


  const next=
   lines[i+1].replace(',','.');


  if(next==='-')continue;


  const value=Number(next);


  if(!Number.isFinite(value))
   continue;


  /* MAÇ SONUCU */

  if(current==='Maç Sonucu'){

   if(line==='1')odds.h=value;

   if(line==='X')odds.d=value;

   if(line==='2')odds.a=value;

  }


  /* 2,5 ALT ÜST */

  if(
   current==='2,5 Alt/Üst' ||
   current==='(2,5) Alt/Üst'
  ){

   if(line==='Alt')
    odds.u25=value;

   if(line==='Üst'){

    odds.o25=value;

    plus6.o25=value;

   }

  }


  /* 3,5 ALT ÜST */

  if(
   current==='3,5 Alt/Üst' ||
   current==='(3,5) Alt/Üst'
  ){

   if(line==='Alt')
    odds.u35=value;

   if(line==='Üst'){

    odds.o35=value;

    plus6.o35=value;

   }

  }


  /* 4,5 */

  if(
   current==='4,5 Alt/Üst' ||
   current==='(4,5) Alt/Üst'
  ){

   if(line==='Üst')
    plus6.o45=value;

  }


  /* KG */

  if(current==='Karşılıklı Gol'){

   if(line==='Var'){

    odds.btts=value;

    plus6.btts=value;

   }

   if(line==='Yok')
    odds.nobtts=value;

  }


  /* İLK YARI 1,5 */

  if(
   current==='1. Yarı 1,5 Alt/Üst' ||
   current==='1.Yarı 1,5 Alt/Üst'
  ){

   if(line==='Alt')
    odds.iyu15=value;

   if(line==='Üst')
    odds.iyo15=value;

  }


  /* İLK YARI 0,5 */

  if(
   current==='1. Yarı 0,5 Alt/Üst' ||
   current==='1.Yarı 0,5 Alt/Üst'
  ){

   if(line==='Üst')
    plus6.iy05=value;

  }


  /* İLK GOL */

  if(current==='İlk Gol'){

   if(line==='Olmaz')
    plus6.nofirst=value;

  }


  /* 6+ GOL */

  if(current==='Toplam Gol Aralığı'){

   if(line==='6+ Gol')
    odds.g6=value;

  }

 }


 return{
  odds,
  plus6
 };

}


/* ==========================================
   ATASU MODEL
========================================== */

async function scanOdds(){

 try{

  const parsed=parseBulk();


  if(
   Object.keys(parsed.odds).length<2
  ){

   throw new Error(
    'En az 2 desteklenen oran bulunamadı.'
   );

  }


  const j=await post(
   '/api/odds',
   {

    odds:parsed.odds,

    tolerance:
     numberValue('tol') ?? 0.05,

    league:
     document.getElementById('league').value,

    limit:10000

   }
  );


  const readOdds=
   Object.entries(
    j.searched_odds || {}
   )

   .map(([k,v])=>`

    <span class="codebox">

     ${MARKET_NAMES[k] || k}:
     ${Number(v).toFixed(2)}

    </span>

   `)

   .join('');


  const consensus=
   (j.consensus || [])

   .slice(0,8)

   .map(x=>{

    const cls=
     x.agreement==='YÜKSEK'
     ? 'good'
     : x.agreement==='ORTA'
     ? 'mid'
     : 'bad';

    return `

    <div class="consensus">

     <strong>
      ${x.market}
     </strong>

     <span>
      %${x.history}
     </span>

     <span>
      %${x.model}
     </span>

     <span class="pill ${cls}">
      ${x.agreement}
     </span>

    </div>

    `;

   })

   .join('');


  const histScores=
   (j.stats?.top_scores || [])

   .map(x=>
    `<span>
     ${x.score} · %${x.percent}
    </span>`
   )

   .join('');


  const modelScores=
   (j.model?.top_scores || [])

   .map(x=>
    `<span>
     ${x.score} · %${x.percent}
    </span>`
   )

   .join('');


  const refs=
   (j.matches || [])

   .map((x,index)=>{

    const compared=
     Object.keys(
      j.searched_odds || {}
     )

     .map(k=>{

      if(
       x[k]===null ||
       x[k]===undefined
      )
       return '';

      const diff=
       (x._differences || {})[k];

      return `
       ${MARKET_NAMES[k] || k}
       ${Number(x[k]).toFixed(2)}
       ${
        diff!==undefined
        ? `Δ${Number(diff).toFixed(3)}`
        : ''
       }
      `;

     })

     .filter(Boolean)
     .join(' · ');


    return `

    <div class="row">

     <span>

      <b>
       ${index+1}.
       ${x.home || '-'}
       —
       ${x.away || '-'}
      </b>

      <br>

      <small>

       ${x.league || '-'}
       · İY ${x.ht || '-'}
       · MS ${x.ft || '-'}

      </small>

      <br>

      <small>
       ${compared}
      </small>

     </span>

    </div>

    `;

   })

   .join('');


  oddsOut.innerHTML=`

  <div class="card hero">

   <div class="title">
    ATASU UYUM PANELİ
   </div>


   <div class="k">

    <div>

     <b>
      ${j.matched ?? 0}
     </b>

     <small>
      gerçek eşleşme
     </small>

    </div>


    <div>

     <b>
      ${j.model?.expected_goals ?? '-'}
     </b>

     <small>
      beklenen toplam gol*
     </small>

    </div>


    <div>

     <b>
      ${j.best_match_count ?? 0}/
      ${j.searched_count ?? 0}
     </b>

     <small>
      en iyi eşleşme
     </small>

    </div>

   </div>


   <div class="consensus head">

    <span>PAZAR</span>
    <span>GEÇMİŞ</span>
    <span>MODEL</span>
    <span>UYUM</span>

   </div>


   ${
    consensus ||
    '<small>Karşılaştırma üretilemedi.</small>'
   }


   <div class="note">

    <small>

     * Beklenen gol gerçek takım xG verisi değildir.
     Girilen piyasa oranlarından matematiksel olarak
     türetilir.

    </small>

   </div>

  </div>


  <div class="card">

   <div class="title">
    MODEL ÖZETİ
   </div>


   <div class="row">

    <span>
     Beklenen toplam gol
    </span>

    <b>
     ${j.model?.expected_goals ?? '-'}
    </b>

   </div>


   <div class="row">

    <span>
     Ev gol beklentisi*
    </span>

    <b>
     ${j.model?.home_xg_proxy ?? '-'}
    </b>

   </div>


   <div class="row">

    <span>
     Deplasman gol beklentisi*
    </span>

    <b>
     ${j.model?.away_xg_proxy ?? '-'}
    </b>

   </div>


   <div class="title"
        style="margin-top:12px">

    Model skor dağılımı

   </div>


   <div class="scorechips">

    ${modelScores || '-'}

   </div>

  </div>


  <div class="card">

   <div class="k">

    <div>

     <b>
      ${j.matched ?? 0}
     </b>

     <small>
      geçmiş eşleşme
     </small>

    </div>


    <div>

     <b>
      ${j.pool_size ?? 0}
     </b>

     <small>
      taranan maç
     </small>

    </div>


    <div>

     <b>
      ${j.stats?.sample_ft ?? 0}
     </b>

     <small>
      örneklem
     </small>

    </div>

   </div>


   <div class="title">
    Okunan oranlar
   </div>

   ${readOdds}


   <p>
    <small>
     ${j.method || ''}
    </small>
   </p>


   <div class="row">

    <span>
     Geçmiş ortalama gol
    </span>

    <b>
     ${j.stats?.avg_goals ?? '-'}
    </b>

   </div>


   <div class="title"
        style="margin-top:12px">

    Geçmiş en sık skorlar

   </div>


   <div class="scorechips">

    ${histScores || '-'}

   </div>


   <div class="title"
        style="margin-top:12px">

    Geçmiş sonuç istatistikleri

   </div>


   ${statsHTML(j.stats)}

  </div>


  <div class="card">

   <div class="title">

    Tüm Geçmiş Referanslar
    (${j.matched ?? 0})

   </div>


   ${
    refs ||
    '<small>Eşleşen geçmiş maç yok.</small>'
   }

  </div>

  `;

 }
 catch(e){

  alert(e.message);

 }

}


/* ==========================================
   +6 GOL
========================================== */

async function scanPlus6(){

 try{

  const parsed=parseBulk();


  const j=await post(
   '/api/plus6',
   parsed.plus6
  );


  const rules=
   (j.rules || [])

   .map(r=>{

    let val='-';


    if(
     r.value!==undefined &&
     r.value!==null
    ){

     val=r.value;

    }


    if(r.values){

     val=
      r.values

      .filter(x=>
       x!==null &&
       x!==undefined
      )

      .join(' / ')
      || '-';

    }


    return `

    <div class="row">

     <span>

      ${r.name}

      <br>

      <small>
       Okunan değer:
       ${val}
      </small>

     </span>


     <b class="${
      r.match
      ? 'good'
      : 'bad'
     }">

      ${
       r.match
       ? 'UYDU'
       : 'UYMUYOR'
      }

     </b>

    </div>

    `;

   })

   .join('');


  plusOut.innerHTML=`

  <div class="card">

   <div class="k">

    <div>

     <b>
      ${j.matched_rules ?? 0}/5
     </b>

     <small>
      uyumlu kural
     </small>

    </div>


    <div>

     <b>
      %${j.compatibility_percent ?? 0}
     </b>

     <small>
      referans uyumu
     </small>

    </div>


    <div>

     <b>
      ${j.total_rules ?? 5}
     </b>

     <small>
      toplam kural
     </small>

    </div>

   </div>


   ${rules}


   <p>

    <small>
     ${j.note || ''}
    </small>

   </p>

  </div>

  `;

 }
 catch(e){

  alert(e.message);

 }

}


/* ==========================================
   TEMİZLE
========================================== */

function clearAll(){

 document.getElementById(
  'bulk'
 ).value='';


 document.getElementById(
  'league'
 ).value='';


 document.getElementById(
  'tol'
 ).value='0.05';


 document.getElementById(
  'oddsOut'
 ).innerHTML='';


 document.getElementById(
  'plusOut'
 ).innerHTML='';


 document.getElementById(
  'bulk'
 ).focus();


 window.scrollTo({
  top:0,
  behavior:'smooth'
 });

}


/* ==========================================
   META
========================================== */

(async()=>{

 try{

  const r=
   await fetch('/api/meta');


  const j=
   await r.json();


  document.getElementById(
   'meta'
  ).textContent=

   `${j.history_rows.toLocaleString('tr-TR')} geçmiş maç yüklü · `+

   `${j.completed_rows.toLocaleString('tr-TR')} sonuçlu maç · `+

   `v${j.version || '3'}`;

 }
 catch{

  document.getElementById(
   'meta'
  ).textContent=
   'Geçmiş veri bilgisi alınamadı';

 }

})();

</script>

</body>
</html>
