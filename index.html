<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATASU Intelligence 4.9.4</title>
<style>
:root{
  --bg:#0b1020;--card:#141b2d;--line:#243049;--txt:#e8eefc;--muted:#8ea0c0;
  --acc:#3ee0a2;--acc2:#6ea8ff;--bad:#ff6b7a;--warn:#ffc857;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,sans-serif}
body{padding:16px 14px 48px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:22px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{background:#1a2338;border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;cursor:pointer}
.tab.on{background:#1d3a34;border-color:#2f6b59;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
textarea,input,select{width:100%;background:#0f1626;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
textarea{min-height:150px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.g{background:var(--acc);color:#062016}
.b{background:#2a3d68;color:#dbe7ff}
.r{background:#4a2230;color:#ffd0d6}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k{background:#10182a;border:1px solid var(--line);border-radius:10px;padding:10px}
.k b{display:block;font-size:18px}
.ok{color:var(--acc)}.no{color:var(--bad)}.mu{color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#c9d6f0}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <h1>ATASU Intelligence 4.9.4</h1>
  <div class="sub" id="metaLine">Yükleniyor…</div>
  <div class="tabs">
    <button class="tab on" data-t="model">ATASU MODEL</button>
    <button class="tab" data-t="exact">EXCEL ORAN</button>
    <button class="tab" data-t="p6">+6 GOL</button>
  </div>

  <section id="panel-model" class="card">
    <label>Bülten / Maçkolik metni</label>
    <textarea id="txtModel" placeholder="Bülteni yapıştır veya Maçkolik linki kullan"></textarea>
    <div class="row">
      <div><label>Maçkolik linki</label><input id="link" placeholder="https://www.mackolik.com/..."></div>
      <div><label>Lig filtresi (opsiyonel)</label><input id="league" placeholder="ör. BREK"></div>
    </div>
    <div class="row">
      <div><label>Tolerans</label><input id="tol" type="number" step="0.01" value="0.05"></div>
      <div><label>Limit</label><input id="lim" type="number" value="200"></div>
    </div>
    <div class="row">
      <div><label>Bülten tarihi</label><input id="bDate" placeholder="2026-09-22"></div>
      <div><label>&nbsp;</label><button class="b" onclick="loadBulletin()">Bugünün bülteni</button></div>
    </div>
    <div id="bulletinBox" class="mu"></div>
    <div class="btns">
      <button class="b" onclick="pullLink()">Linki çek</button>
      <button class="g" onclick="scanModel()">Tara</button>
      <button class="r" onclick="clearAll('txtModel','outModel')">Temizle</button>
    </div>
    <div id="outModel"></div>
  </section>

  <section id="panel-exact" class="card hidden">
    <label>Aynı bülten (birebir eşleşme, tolerans yok)</label>
    <textarea id="txtExact"></textarea>
    <div class="btns">
      <button class="g" onclick="scanExact()">Birebir tara</button>
      <button class="r" onclick="clearAll('txtExact','outExact')">Temizle</button>
    </div>
    <div id="outExact"></div>
  </section>

  <section id="panel-p6" class="card hidden">
    <p class="mu">Referans bant: 2,5Ü 1.20–1.28 · 3,5Ü 1.66–1.89 · 4,5Ü/g45 2.64–3.14 · KG Var 1.22–1.87 · İY 0,5Ü 1.05–1.08 veya İlk Gol Olmaz 22.10–26.00</p>
    <label>Bülten</label>
    <textarea id="txtP6"></textarea>
    <div class="btns">
      <button class="g" onclick="scanP6()">+6 analiz</button>
      <button class="r" onclick="clearAll('txtP6','outP6')">Temizle</button>
    </div>
    <div id="outP6"></div>
  </section>

  <section class="card">
    <b>Kelly hesap</b>
    <div class="row">
      <div><label>Oran</label><input id="kOdds" type="number" step="0.01" value="1.85"></div>
      <div><label>Tahmini isabet %</label><input id="kP" type="number" step="0.1" value="60"></div>
    </div>
    <div class="row">
      <div><label>Kasa (opsiyonel)</label><input id="kBank" type="number" step="1" placeholder="1000"></div>
      <div><label>&nbsp;</label><button class="g" onclick="calcKelly()">Hesapla</button></div>
    </div>
    <div id="outKelly"></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    ['model','exact','p6'].forEach(t=>$('panel-'+t).classList.toggle('hidden', t!==btn.dataset.t));
  };
});

fetch('/api/meta').then(r=>r.json()).then(m=>{
  $('metaLine').textContent = `${m.history_rows} kayıt · ${m.completed_rows} sonuçlu · v${m.version}` + (m.warning? ' · '+m.warning:'');
}).catch(()=>{$('metaLine').textContent='API yok — uvicorn app:app --port 8000';});

function parseBulletin(text){
  const t = (text||'').replace(/\u00a0/g,' ').replace(/[–—]/g,'-');
  const odds = {};
  const grab2 = (re, k1, k2)=>{
    const m = t.match(re);
    if(!m) return;
    const a = parseFloat(String(m[1]).replace(',','.'));
    const b = parseFloat(String(m[2]).replace(',','.'));
    if(a>1 && a<80) odds[k1]=a;
    if(b>1 && b<80) odds[k2]=b;
  };
  const grab1 = (re, k)=>{
    const m = t.match(re);
    if(!m) return;
    const a = parseFloat(String(m[1]).replace(',','.'));
    if(a>1 && a<80) odds[k]=a;
  };
  grab2(/2\s*[,.]?\s*5\s*Alt\s*\/\s*Üst\s+([0-9]+[.,][0-9]+)\s+([0-9]+[.,][0-9]+)/i,'u25','o25');
  grab2(/3\s*[,.]?\s*5\s*Alt\s*\/\s*Üst\s+([0-9]+[.,][0-9]+)\s+([0-9]+[.,][0-9]+)/i,'u35','o35');
  grab2(/4\s*[,.]?\s*5\s*Alt\s*\/\s*Üst\s+([0-9]+[.,][0-9]+)\s+([0-9]+[.,][0-9]+)/i,'g45','o45');
  grab2(/Karşılıklı\s*Gol[^\n]*?Var\s+([0-9]+[.,][0-9]+)[^\n]*?Yok\s+([0-9]+[.,][0-9]+)/i,'btts','nobtts');
  if(!odds.btts) grab1(/Karşılıklı\s*Gol[^\n]*?Var\s+([0-9]+[.,][0-9]+)/i,'btts');
  grab2(/1\.\s*Yarı\s*0\s*[,.]?\s*5\s*Alt\s*\/\s*Üst\s+([0-9]+[.,][0-9]+)\s+([0-9]+[.,][0-9]+)/i,'iyu05','iy05');
  grab2(/1\.\s*Yarı\s*1\s*[,.]?\s*5\s*Alt\s*\/\s*Üst\s+([0-9]+[.,][0-9]+)\s+([0-9]+[.,][0-9]+)/i,'iyu15','iyo15');
  grab1(/İlk\s*Gol[^\n]*?Olmaz\s+([0-9]+[.,][0-9]+)/i,'nofirst');
  if(!odds.nofirst) grab1(/İlk\s*Korner[^\n]*?Olmaz\s+([0-9]+[.,][0-9]+)/i,'nofirst');
  grab1(/6\s*\+\s*Gol\s+([0-9]+[.,][0-9]+)/i,'g6');
  const ms = t.match(/(?:Maç\s*Sonucu|1\s*X\s*2)[^\n]*?([0-9]+[.,][0-9]+)\s+([0-9]+[.,][0-9]+)\s+([0-9]+[.,][0-9]+)/i);
  if(ms){
    const h=parseFloat(ms[1].replace(',','.')), d=parseFloat(ms[2].replace(',','.')), a=parseFloat(ms[3].replace(',','.'));
    if(h>1) odds.h=h; if(d>1) odds.d=d; if(a>1) odds.a=a;
  }
  return odds;
}

function chips(odds){
  return Object.entries(odds).map(([k,v])=>`<span class="k" style="display:inline-block;margin:3px">${k}: <b>${v}</b></span>`).join(' ');
}
function clearAll(a,b){ $(a).value=''; $(b).innerHTML=''; }

async function loadBulletin(){
  const d = $('bDate').value.trim();
  const q = d ? ('?date='+encodeURIComponent(d)) : '';
  const r = await fetch('/api/bulletin'+q);
  const j = await r.json();
  if(!r.ok) return $('bulletinBox').innerHTML = '<span class="no">'+(j.detail||'bülten yok')+'</span>';
  const rows = j.matches||[];
  $('bulletinBox').innerHTML = `<div>${j.count} maç · ${j.date}</div>` + rows.slice(0,80).map((m,i)=>
    `<div class="k" style="margin:4px 0;cursor:pointer" onclick="pickMatch(${i})">${m.time||''} ${m.league||''} <b>${m.home} - ${m.away}</b> ${m.h||'-'}/${m.d||'-'}/${m.a||'-'}</div>`
  ).join('');
  window._bulten = rows;
}
function pickMatch(i){
  const m = (window._bulten||[])[i];
  if(!m) return;
  const lines = [
    `${m.home} - ${m.away}`,
    m.h?`1 X 2 ${m.h} ${m.d} ${m.a}`:'',
    (m.u25&&m.o25)?`2,5 Alt/Üst ${m.u25} ${m.o25}`:''
  ].filter(Boolean).join('\n');
  $('txtModel').value = lines;
  if(m.morebets) $('link').value = m.morebets;
}

async function pullLink(){
  const url=$('link').value.trim();
  if(!url) return alert('Link gir');
  const r = await fetch('/api/match-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  const j = await r.json();
  if(!r.ok) return alert(j.detail||'Link okunamadı');
  $('txtModel').value = (j.title? j.title+'\n':'') + (j.text||'');
}

async function scanModel(){
  const odds = parseBulletin($('txtModel').value);
  $('outModel').innerHTML = `<div class="mu">Ayıklanan:</div>${chips(odds)}`;
  if(Object.keys(odds).length<2) return $('outModel').innerHTML += '<p class="no">En az 2 oran lazım.</p>';
  const body = {odds, tolerance: Number($('tol').value||0.05), league:$('league').value, limit:Number($('lim').value||200)};
  const r = await fetch('/api/odds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) return $('outModel').innerHTML += `<p class="no">${j.detail||'hata'}</p>`;
  const s=j.stats||{};
  $('outModel').innerHTML += `
    <div class="kpi" style="margin-top:10px">
      <div class="k">Eşleşen<b>${j.matched}</b></div>
      <div class="k">Havuz<b>${j.pool_size}</b></div>
      <div class="k">Ort gol<b>${s.avg_goals??'-'}</b></div>
      <div class="k">2,5 Üst<b>${s['2,5 Üst']??'-'}%</b></div>
      <div class="k">6+ Gol<b>${s['6+ Gol']??'-'}%</b></div>
      <div class="k">Banko<b>${j.banko?.status||'-'}</b></div>
      <div class="k">Beklenen gol<b>${j.expected_goals??'-'}</b></div>
    </div>
    ${(j.signals||[]).slice(0,8).map(s=>`<div>${s.name} @${s.odds??'-'}: geçmiş %${s.historical_percent} · edge ${s.edge??'-'} · Kelly ${s.kelly!=null?(s.kelly_half*100).toFixed(1)+'% (½)':'-'} · Wilson ${s.wilson_low??'-'} · ${s.signal}</div>`).join('')}
    <p class="mu">${j.method}</p>
    ${(j.why||[]).map(x=>`<div>• ${x}</div>`).join('')}
    ${tableMatches(j.matches)}`;
}

async function scanExact(){
  const odds = parseBulletin($('txtExact').value);
  const r = await fetch('/api/exact-odds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({odds,tolerance:0})});
  const j = await r.json();
  if(!r.ok) return $('outExact').innerHTML = `<p class="no">${j.detail||'hata'}</p>`;
  $('outExact').innerHTML = chips(odds) + (j.categories||[]).map(c=>`
    <div class="card"><b>${c.category}</b> · ${c.status} · ${c.matched}
    ${(c.summary?.top||[]).map(o=>`<div>${o.name}: %${o.percent}</div>`).join('')}</div>`).join('');
}

async function scanP6(){
  const o = parseBulletin($('txtP6').value);
  const payload = {o25:o.o25,o35:o.o35,o45:o.o45,g45:o.g45,btts:o.btts,iy05:o.iy05,nofirst:o.nofirst,g6:o.g6,iyu15:o.iyu15,iyo15:o.iyo15};
  const r = await fetch('/api/plus6',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j = await r.json();
  if(!r.ok) return $('outP6').innerHTML = `<p class="no">${j.detail||'hata'}</p>`;
  const cls = j.compatibility_percent>=80?'ok': j.compatibility_percent>=40?'warn':'no';
  $('outP6').innerHTML = `
    ${chips(o)}
    <div class="k" style="margin:10px 0"><span class="${cls}">Uyumluluk %${j.compatibility_percent}</span> · ${j.matched_rules}/${j.total_rules}</div>
    ${(j.rules||[]).map(x=>`<div class="${x.match?'ok':'no'}">${x.match?'✔':'✖'} ${x.name} · ${x.value??(x.values||[]).filter(v=>v!=null).join(' / ')||'-'} · [${(x.range||[]).join('–')}]</div>`).join('')}
    <p class="mu">${j.note||''}</p>`;
}

async function calcKelly(){
  const body = {odds:Number($('kOdds').value), probability_percent:Number($('kP').value), bankroll: Number($('kBank').value)||null};
  const r = await fetch('/api/kelly',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) return $('outKelly').innerHTML = `<p class="no">${j.detail||'hata'}</p>`;
  $('outKelly').innerHTML = `<div class="kpi" style="margin-top:8px">
    <div class="k">Tam Kelly<b>%${j.kelly_pct}</b></div>
    <div class="k">Yarım Kelly<b>%${j.kelly_half_pct}</b></div>
    <div class="k">EV<b>${j.expected_value}</b></div>
    <div class="k">Stake<b>${j.stake??'-'}</b></div>
  </div><p class="mu">${j.formula} · ${j.note}</p>`;
}

function tableMatches(rows){
  if(!rows||!rows.length) return '<p class="mu">Eşleşen maç yok.</p>';
  const head = '<tr><th>Tarih</th><th>Lig</th><th>Maç</th><th>İY</th><th>MS</th><th>Uyum</th></tr>';
  const body = rows.slice(0,40).map(r=>`<tr><td>${r.date||''}</td><td>${r.league||''}</td><td>${r.home||''} - ${r.away||''}</td><td>${r.ht||''}</td><td>${r.ft||''}</td><td>${r._matched_odds||''}/${r._compared_odds||''}</td></tr>`).join('');
  return `<table>${head}${body}</table>`;
}
</script>
</body>
</html>
