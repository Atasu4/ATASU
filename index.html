<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATASU</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#2a3140;--txt:#e8edf5;--mute:#8b95a8;--go:#3dd68c;--no:#ff6b6b;--acc:#6ea8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{margin-bottom:14px}
h1{font-size:20px;margin:0}
.meta{color:var(--mute);font-size:12px;margin-top:4px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;background:#12161c;border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:10px}
.tab.on{border-color:var(--acc);background:#1a2333}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.hidden{display:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.g{background:var(--go);color:#062}
.b{background:#2a3548;color:#dbe7ff}
.hint,.mu,.no{color:var(--mute);font-size:13px}
.no{color:var(--no)}
.b-card{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.saat{color:var(--mute);font-size:13px}
.tm{font-weight:650}
.odds{color:var(--mute);font-size:12px}
.verdict{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.verdict.go{border-color:#2e6}
.kicker{font-size:12px;color:var(--mute)}
.v-title{font-weight:700;margin:4px 0}
.yorum{margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ATASU</h1>
    <div class="meta" id="metaLine">İddaa bülteni · şablon masa</div>
    <nav class="tabs">
      <button class="tab on" data-t="bulten">Bülten</button>
      <button class="tab" data-t="masa">Masa</button>
    </nav>
  </header>
  <section id="panel-bulten" class="card">
    <p class="hint">Bugünün İddaa programı. Satırda Analiz = tek tık.</p>
    <div class="btns">
      <button class="g" onclick="loadBulletin()">Bülteni yükle</button>
    </div>
    <div id="bulletinBox"></div>
  </section>
  <section id="panel-masa" class="card hidden">
    <p class="hint">Aynı bülten, senin attığın maç oranlarına vurulur. Oturan satır çıkar.</p>
    <div class="btns">
      <button class="g" onclick="runFilterScan()">Masayı tara</button>
    </div>
    <div id="outMasa" class="mu">Masayı tara.</div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b===btn));
    $('panel-bulten').classList.toggle('hidden', btn.dataset.t!=='bulten');
    $('panel-masa').classList.toggle('hidden', btn.dataset.t!=='masa');
  };
});
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&','<':'<','>':'>'}[c]));}
async function fetchT(url, opt, ms){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms||15000);
  try{
    const r = await fetch(url, Object.assign({}, opt||{}, {signal: ctl.signal}));
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.detail || j.error || ('HTTP '+r.status));
    return j;
  }catch(e){
    if(String(e.name||e)==='AbortError') throw new Error('Zaman doldu.');
    throw e;
  }finally{ clearTimeout(t); }
}
function localISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
async function loadBulletin(){
  const box = $('bulletinBox');
  box.innerHTML = '<p class="mu">Bülten çekiliyor…</p>';
  try{
    const j = await fetchT('/api/bulletin?date='+localISO(), null, 15000);
    const rows = j.matches||[];
    if(!rows.length){
      box.innerHTML = '<p class="no">Bugün açık İddaa satırı yok. ('+esc(j.date||'')+')</p>';
      return;
    }
    window._bulten = rows;
    let html = '<p class="hint">'+rows.length+' maç · '+esc(j.date||'')+'</p>';
    rows.forEach((m,i)=>{
      html += '<div class="b-card">'+
        '<div class="saat">'+esc(m.time||'—')+'</div>'+
        '<div><div class="tm">'+esc(m.home||'')+' — '+esc(m.away||'')+'</div>'+
        '<div class="odds">'+(m.league?esc(m.league)+' · ':'')+(m.h||'—')+' / '+(m.d||'—')+' / '+(m.a||'—')+
        (m.o25? ' · 2,5Ü '+m.o25:'')+(m.u25? ' · 2,5A '+m.u25:'')+'</div></div>'+
        '<button type="button" class="b" data-i="'+i+'">Analiz</button></div>';
    });
    box.innerHTML = html;
    box.onclick = ev=>{
      const btn = ev.target.closest('button[data-i]');
      if(!btn) return;
      analyzeRow(rows[Number(btn.getAttribute('data-i'))]);
    };
  }catch(e){
    box.innerHTML = '<p class="no">Bülten yok: '+esc(e.message||e)+'</p>';
  }
}
async function analyzeRow(m){
  if(!m) return;
  const box = $('bulletinBox');
  const hold = box.innerHTML;
  box.insertAdjacentHTML('afterbegin', '<div class="verdict" id="rowAnaliz"><p class="mu">Analiz… '+esc(m.home)+' — '+esc(m.away)+'</p></div>');
  try{
    const j = await fetchT('/api/row', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(m)}, 12000);
    const el = $('rowAnaliz');
    if(!el) return;
    const go = j.karar==='OYNA';
    el.className = 'verdict '+(go?'go':'');
    el.innerHTML = '<div class="kicker">'+(j.karar||'GEC')+(j.strategy? ' · '+esc(j.strategy):'')+'</div>'+
      '<div class="v-title">'+esc((m.home||'')+' — '+(m.away||''))+'</div>'+
      '<p class="yorum">'+esc((j.pick||'')+' '+(j.odds||'')+' — '+(j.why||j.script||''))+'</p>';
  }catch(e){
    const el = $('rowAnaliz');
    if(el) el.innerHTML = '<p class="no">'+esc(e.message||e)+'</p>';
    else box.innerHTML = hold;
  }
}
async function runFilterScan(){
  const box = $('outMasa');
  box.innerHTML = '<p class="mu">Şablon taranıyor…</p>';
  try{
    const j = await fetchT('/api/filter-scan', null, 20000);
    if(!j.matches||!j.matches.length){
      box.innerHTML = '<p class="no">Oturan şablon yok. Taranan '+(j.scanned||0)+'.</p>';
      return;
    }
    let html = '<p class="hint">'+j.n+' satır · taranan '+(j.scanned||0)+'</p>';
    j.matches.forEach(m=>{
      html += '<div class="verdict go">'+
        '<div class="kicker">'+(m.time||'')+' · '+esc(m.league||'')+'</div>'+
        '<div class="v-title">'+esc(m.title||'')+'</div>'+
        '<p class="yorum">'+esc((m.strategy||'')+' → '+(m.pick||'')+' '+(m.pick_odds||''))+'</p>'+
        (m.why? '<p class="hint">'+esc(m.why)+'</p>':'')+
        '</div>';
    });
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = '<p class="no">'+esc(e.message||e)+'</p>';
  }
}
fetch('/api/meta').then(r=>r.json()).then(m=>{
  $('metaLine').textContent = 'v'+(m.version||'')+' · '+((m.filters||[]).length||9)+' şablon · bülten';
}).catch(()=>{});
</script>
</body>
</html>
